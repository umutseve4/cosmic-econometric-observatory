<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Browser DOM smoke</title></head>
<body>
<pre id="result">RUNNING</pre>
<script type="module">
import { createBrowserDomPort, project, renderProjection } from '../dist/src/index.js';

const result = document.querySelector('#result');
const hostileLabel = '<img src=x onerror="globalThis.__M3D_XSS__=1"> & <script>globalThis.__M3D_SCRIPT__=1<\/script>';
const scene = {
  schemaVersion: '0.1.0', layoutVersion: 'real-browser-smoke-v1', seed: 'real-browser-smoke',
  inputHash: `sha256:${'d'.repeat(64)}`,
  nodes: [
    { id: 'node:b', semanticKind: 'course', label: hostileLabel, position: { x: 2, y: 0, z: 2 }, focusOrder: 2, capabilities: ['inspect'] },
    { id: 'node:a', semanticKind: 'program', label: 'A & B', position: { x: 1, y: 0, z: 1 }, focusOrder: 1, capabilities: ['inspect'] }
  ],
  edges: [{ id: 'edge:a-b', semanticKind: 'CONTAINS', source: 'node:a', target: 'node:b' }]
};
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const same = (left, right) => JSON.stringify(left) === JSON.stringify(right);

try {
  const htmlManifest = project(scene, 'html');
  const port = createBrowserDomPort(document);
  const htmlTarget = document.createElement('div');
  let htmlMounts = 0;
  const htmlReceipt = renderProjection(htmlManifest, { replaceChildren(...nodes) { htmlMounts += 1; htmlTarget.replaceChildren(...nodes); } }, { dom: port });
  assert(htmlMounts === 1, 'html mount count');
  assert(same(htmlReceipt.nodeIds, ['node:a', 'node:b']), 'html receipt nodes');
  assert(same(htmlReceipt.edgeIds, ['edge:a-b']), 'html receipt edges');
  assert(same(htmlReceipt.focusOrderNodeIds, ['node:a', 'node:b']), 'html receipt focus');
  assert(htmlTarget.children.length === 3, 'html parsed roots');
  assert(!htmlTarget.querySelector('img'), 'html hostile image became active');
  assert(!htmlTarget.querySelector('[onerror]'), 'html event attribute survived');
  assert(htmlTarget.textContent.includes(hostileLabel), 'html label did not decode exactly');
  assert(globalThis.__M3D_XSS__ === undefined && globalThis.__M3D_SCRIPT__ === undefined, 'html hostile content executed');
  const htmlPrepared = port.prepareHtml(htmlManifest.content);
  assert(same(htmlPrepared.nodeDescriptors, htmlManifest.nodeDescriptors), 'html node descriptor parity');
  assert(same(htmlPrepared.edgeDescriptors, htmlManifest.edgeDescriptors), 'html edge descriptor parity');

  result.textContent = 'M3D_BROWSER_SMOKE_PASS';
} catch (error) {
  result.textContent = `M3D_BROWSER_SMOKE_FAIL:${error instanceof Error ? error.message : String(error)}`;
}
</script>
</body>
</html>
