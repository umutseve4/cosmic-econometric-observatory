<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive product acceptance smoke</title><style>html,body{margin:0;min-height:100%}iframe{display:block;height:12000px;border:0}#result{position:fixed;inset:auto 0 0;margin:0;padding:4px;background:#fff;color:#000;z-index:9999}</style></head>
<body><iframe id="site" title="Kozmik Ekonometri responsive test"></iframe><pre id="result">RESPONSIVE_PRODUCT_SMOKE_RUNNING</pre>
<script>
const PASS='RESPONSIVE_PRODUCT_SMOKE_PASS',FAIL='RESPONSIVE_PRODUCT_SMOKE_FAIL';
const result=document.querySelector('#result'),frame=document.querySelector('#site'),params=new URL(location.href).searchParams;
const requestedWidth=Number(params.get('width')),mode=params.get('mode');
if(!Number.isInteger(requestedWidth)||requestedWidth<240||requestedWidth>2000)throw new Error('invalid requested width');
if(!['default','fallback'].includes(mode))throw new Error('invalid render mode');
frame.style.width=`${requestedWidth}px`;
function fail(message){result.textContent=`${FAIL}:${message}`}
function finitePath(path){return /^M -?\d+(?:\.\d+)? -?\d+(?:\.\d+)? L -?\d+(?:\.\d+)? -?\d+(?:\.\d+)?$/u.test(path)}
function label(element){const name=element.id?`#${element.id}`:element.className?`.${String(element.className).trim().replace(/\s+/gu,'.')}`:element.tagName;return `${name}[${element.clientWidth}/${element.scrollWidth}]`}
function inspect(){
 const doc=frame.contentDocument,win=frame.contentWindow;if(!doc||!win)throw new Error('iframe unavailable');
 frame.style.height=`${Math.max(doc.documentElement.scrollHeight,doc.body.scrollHeight)+1}px`;
 const viewport=doc.documentElement.clientWidth;if(viewport!==requestedWidth)throw new Error(`viewport mismatch:${viewport}/${requestedWidth}`);
 const candidates=[...doc.body.querySelectorAll('*')].filter((element)=>{if(element.matches('script,style,[hidden],.ambient-one,.ambient-two'))return false;const style=win.getComputedStyle(element);return style.display!=='none'&&style.visibility!=='hidden'});
 const offenders=candidates.filter((element)=>{const rect=element.getBoundingClientRect();return rect.width>0&&(rect.left<-1||rect.right>viewport+1)});
 const intrinsic=candidates.filter((element)=>element.scrollWidth>element.clientWidth+1);
 const offenderLabels=offenders.slice(0,5).map(label).join(',');
 const intrinsicLabels=intrinsic.slice(0,5).map(label).join(',');
 if(doc.documentElement.scrollWidth>viewport||doc.body.scrollWidth>viewport)throw new Error(`horizontal overflow:${viewport}/${doc.documentElement.scrollWidth}/${doc.body.scrollWidth}:geometry=${offenderLabels||'none'}:intrinsic=${intrinsicLabels||'none'}`);
 if(offenders.length)throw new Error(`clipped elements:${offenderLabels}`);
 for(const selector of ['#course-search','#semester-filter','#status-filter','#search-results','#course-inspector','#html-universe'])if(!doc.querySelector(selector))throw new Error(`missing product control:${selector}`);
 if(doc.querySelectorAll('#search-results button[data-node-id]').length!==144)throw new Error('course result count');
 if(doc.querySelectorAll('#html-universe [data-node-id]').length<147)throw new Error('semantic node surface count');
 const visual=doc.querySelector('#webgl-universe'),renderMode=visual?.dataset.renderMode;
 if(mode==='default'){
  const canvas=visual?.querySelector('canvas');if(renderMode!=='three'||!canvas||canvas.width!==960||canvas.height!==720||canvas.getAttribute('aria-hidden')!=='true')throw new Error(`default render:${renderMode||'missing'}`);
 }
 if(mode==='fallback'){
  const svg=visual?.querySelector('svg');if(renderMode!=='fallback'||!svg)throw new Error(`fallback render:${renderMode||'missing'}`);
  const paths=[...svg.querySelectorAll('path[data-edge-id]')];if(paths.length!==146||paths.some((path)=>!finitePath(path.getAttribute('d')||'')))throw new Error(`svg edge geometry:${paths.length}`);
  if(svg.querySelectorAll('g[data-node-id]').length!==147)throw new Error('svg node count');
 }
 const search=doc.querySelector('#course-search'),dispatchInput=()=>search.dispatchEvent(new win.Event('input',{bubbles:true}));
 const firstCode=doc.querySelector('#search-results button[data-node-id] strong')?.textContent?.trim();if(!firstCode)throw new Error('missing first course code');
 search.value='__NO_SUCH_COURSE__';dispatchInput();search.focus();search.dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true,cancelable:true}));
 if(doc.querySelector('#search-results button[data-node-id]')||doc.activeElement!==search)throw new Error('empty result navigation');
 search.value=firstCode;dispatchInput();const singleton=[...doc.querySelectorAll('#search-results button[data-node-id]')];
 if(singleton.length!==1)throw new Error(`singleton result:${singleton.length}`);
 search.focus();search.dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true,cancelable:true}));
 singleton[0].dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true,cancelable:true}));
 if(doc.activeElement!==singleton[0])throw new Error('singleton result clamp');
 search.value='';dispatchInput();const buttons=[...doc.querySelectorAll('#search-results button[data-node-id]')],first=buttons[0],second=buttons[1],last=buttons.at(-1);
 search.focus();search.dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true,cancelable:true}));
 if(doc.activeElement!==first)throw new Error('search ArrowDown entry');
 first.dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true,cancelable:true}));
 if(doc.activeElement!==second)throw new Error('result ArrowDown navigation');
 first.focus();first.dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowUp',bubbles:true,cancelable:true}));
 if(doc.activeElement!==first)throw new Error('result ArrowUp clamp');
 last.focus();last.dispatchEvent(new win.KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true,cancelable:true}));
 if(doc.activeElement!==last)throw new Error('result ArrowDown clamp');
 first?.click();
 if(!first||first.getAttribute('aria-current')!=='true'||!doc.querySelector('#course-inspector code'))throw new Error('search selection inspector');
 const semester=doc.querySelector('#semester-filter');semester.value='8';semester.dispatchEvent(new win.Event('change',{bubbles:true}));
 if(doc.querySelector('#search-results [aria-current="true"]')||!doc.querySelector('#course-inspector .empty-inspector'))throw new Error('filtered selection clear');
 semester.value='';semester.dispatchEvent(new win.Event('change',{bubbles:true}));
 if(doc.querySelectorAll('#search-results button[data-node-id]').length!==144)throw new Error('filter reset');
 if(doc.querySelector('#result')?.textContent?.trim()!=='M3G_SITE_SMOKE_PASS')throw new Error('runtime marker');
 result.textContent=PASS;
}
frame.addEventListener('load',()=>{const deadline=Date.now()+30000;const poll=()=>{try{const runtime=frame.contentDocument?.querySelector('#result')?.textContent?.trim()||'';if(runtime==='M3G_SITE_SMOKE_PASS'){inspect();return}if(runtime.startsWith('M3G_SITE_SMOKE_FAIL')){fail(runtime);return}if(Date.now()>=deadline){fail(`timeout:${runtime||'missing'}`);return}setTimeout(poll,50)}catch(error){fail(error instanceof Error?error.message:String(error))}};poll()},{once:true});
frame.addEventListener('error',()=>fail('iframe load error'),{once:true});
frame.src=`/dist-site/index.html?responsive-smoke=1${mode==='fallback'?'&force-fallback=true':''}`;
</script></body></html>
