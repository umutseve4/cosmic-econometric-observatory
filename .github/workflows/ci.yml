name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  locate-typescript-diagnostics:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { code: 2322, range: 085-089 }
          - { code: 2322, range: 090-094 }
          - { code: 2322, range: 105-109 }
          - { code: 2322, range: 110-114 }
          - { code: 2345, range: 100-102 }
          - { code: 2345, range: 103-104 }
    name: locate-TS${{ matrix.code }}-${{ matrix.range }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Locate TypeScript diagnostic
        env:
          CODE: ${{ matrix.code }}
          RANGE: ${{ matrix.range }}
        run: |
          node -e "const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('tsconfig.json','utf8'));c.include=['src/**/*.ts'];fs.writeFileSync('tsconfig.diagnostic.json',JSON.stringify(c));"
          npx tsc -p tsconfig.diagnostic.json --noEmit --pretty false > diagnostics.txt 2>&1 || true
          node -e "const fs=require('node:fs');const [lo,hi]=process.env.RANGE.split('-').map(Number);const code=Number(process.env.CODE);const text=fs.readFileSync('diagnostics.txt','utf8');const hits=[...text.matchAll(/^(.+)\((\d+),(\d+)\): error TS(\d+):/gm)].filter(([,file,line,,diagnostic])=>file==='src/curriculum-compiler.ts'&&Number(diagnostic)===code&&Number(line)>=lo&&Number(line)<=hi);process.exit(hits.length>0?1:0);"
