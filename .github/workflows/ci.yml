name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: curriculum-compiler
            file: dist/tests/curriculum-compiler.test.js
          - name: buu-snapshot
            file: dist/tests/buu-snapshot.test.js
          - name: world
            file: dist/tests/world.test.js
          - name: m1-integrity
            file: tests/m1-integrity.test.mjs
          - name: materializer
            file: tests/materializer.test.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run ${{ matrix.name }} tests
        run: node --test "${{ matrix.file }}"
