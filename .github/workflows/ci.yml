name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  identify-typescript-error:
    strategy:
      fail-fast: false
      matrix:
        code: [2304, 2318, 2322, 2345, 2375, 2412, 2532, 2688]
    name: diagnostic-TS${{ matrix.code }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Identify TypeScript diagnostic
        env:
          CODE: ${{ matrix.code }}
        run: |
          npx tsc --noEmit --pretty false > diagnostics.txt 2>&1 || true
          if grep -Fq "error TS${CODE}:" diagnostics.txt; then exit 1; fi
