name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  diagnostic-inventory:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: exact-TS2322-92-9, mode: exact, code: 2322, line: 92, column: 9 }
          - { check: exact-TS2345-103-10, mode: exact, code: 2345, line: 103, column: 10 }
          - { check: exact-TS2322-105-9, mode: exact, code: 2322, line: 105, column: 9 }
          - { check: exactly-three-diagnostics, mode: count, code: 0, line: 0, column: 0 }
          - { check: no-other-codes, mode: inventory, code: 0, line: 0, column: 0 }
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify TypeScript diagnostic inventory
        env:
          MODE: ${{ matrix.mode }}
          CODE: ${{ matrix.code }}
          LINE: ${{ matrix.line }}
          COLUMN: ${{ matrix.column }}
        run: |
          node -e "const fs=require('node:fs');const c=JSON.parse(fs.readFileSync('tsconfig.json','utf8'));c.include=['src/**/*.ts'];fs.writeFileSync('tsconfig.diagnostic.json',JSON.stringify(c));"
          npx tsc -p tsconfig.diagnostic.json --noEmit --pretty false > diagnostics.txt 2>&1 || true
          node -e "const fs=require('node:fs');const text=fs.readFileSync('diagnostics.txt','utf8');const ds=[...text.matchAll(/^(.+)\((\d+),(\d+)\): error TS(\d+):/gm)].map(([,file,line,column,code])=>({file,line:Number(line),column:Number(column),code:Number(code)}));const mode=process.env.MODE;let ok=false;if(mode==='exact')ok=ds.filter(d=>d.file==='src/curriculum-compiler.ts'&&d.code===Number(process.env.CODE)&&d.line===Number(process.env.LINE)&&d.column===Number(process.env.COLUMN)).length===1;if(mode==='count')ok=ds.length===3;if(mode==='inventory')ok=ds.every(d=>d.file==='src/curriculum-compiler.ts'&&((d.code===2322&&[92,105].includes(d.line))||(d.code===2345&&d.line===103)));process.exit(ok?0:1);"
