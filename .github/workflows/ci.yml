name: M2a repair

on:
  push:
    branches: [feat/m2a-curriculum-graph-core]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m2a-curriculum-graph-core
      - name: Apply minimal contextual-typing fix and restore canonical CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path("src/curriculum-compiler.ts")
          source = source_path.read_text()
          source, node_count = re.subn(
              r"(\}\)\)\n)(\s*)\]\.sort\(compareNodes\);",
              r"\1\2];\n\2nodes.sort(compareNodes);",
              source,
          )
          source, edge_count = re.subn(
              r"(\}\)\)\n)(\s*)\]\.sort\(\(a, b\) => compareCodePoints\(a\.id, b\.id\)\);",
              r"\1\2];\n\2edges.sort((a, b) => compareCodePoints(a.id, b.id));",
              source,
          )
          if node_count != 1:
              raise SystemExit(f"expected one node replacement, got {node_count}")
          if edge_count != 1:
              raise SystemExit(f"expected one edge replacement, got {edge_count}")
          source_path.write_text(source)

          canonical_ci = """name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - run: npm ci --ignore-scripts
                - run: npm run verify
          """
          Path(".github/workflows/ci.yml").write_text(canonical_ci)
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/ci.yml\nsrc/curriculum-compiler.ts'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml src/curriculum-compiler.ts
          git commit -m "fix: preserve M2a contextual typing"
          git push origin HEAD:feat/m2a-curriculum-graph-core