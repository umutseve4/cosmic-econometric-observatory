name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: google-chrome --version
      - run: npm run test:browser-smoke
      - run: npm ls --omit=dev --depth=0
      - name: Capture artifact digest
        id: artifact
        shell: bash
        run: echo "digest=$(sha256sum dist-site/artifact-manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload immutable static artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cosmic-site-${{ github.sha }}
          path: dist-site/
          if-no-files-found: error
          compression-level: 0
      - name: Report artifact provenance
        run: echo "source=${{ github.sha }} manifest_sha256=${{ steps.artifact.outputs.digest }}"
