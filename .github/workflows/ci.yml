name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify

  apply-m2a-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/m2a-curriculum-graph-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m2a-curriculum-graph-core
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact staged patch
        run: |
          set -euo pipefail
          sed -n "/python <<'PY'/,/^          PY$/p" .github/workflows/apply-m2a-alias-fix.yml | sed '1d;$d;s/^          //' > /tmp/apply.py
          python /tmp/apply.py
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: enforce cumulative M2a route history"
          git push origin HEAD:feat/m2a-curriculum-graph-core
