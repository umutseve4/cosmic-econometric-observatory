name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  locate-test-error:
    strategy:
      fail-fast: false
      matrix:
        include:
          - bucket: tests-000-099
            pattern: 'tests/[^:]+\\([0-9]{1,2},'
          - bucket: tests-100-199
            pattern: 'tests/[^:]+\\(1[0-9]{2},'
          - bucket: tests-200-299
            pattern: 'tests/[^:]+\\(2[0-9]{2},'
          - bucket: tests-300-399
            pattern: 'tests/[^:]+\\(3[0-9]{2},'
          - bucket: tests-400-499
            pattern: 'tests/[^:]+\\(4[0-9]{2},'
          - bucket: tests-500-plus
            pattern: 'tests/[^:]+\\([5-9][0-9]{2},'
    name: locate-${{ matrix.bucket }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Locate TypeScript diagnostic
        env:
          PATTERN: ${{ matrix.pattern }}
        run: |
          npx tsc --noEmit --pretty false > diagnostics.txt 2>&1 || true
          if grep -Eq "$PATTERN" diagnostics.txt; then exit 1; fi
