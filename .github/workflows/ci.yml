name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify types, tests, and deterministic artifact
        run: npm run verify
      - name: Report Chrome version
        run: google-chrome --version
      - name: Diagnose M3i Three selection smoke
        id: m3i_three
        continue-on-error: true
        env:
          BROWSER_SMOKE_CASE: m3i-selection-three
        run: npm run test:browser-smoke
      - name: Diagnose M3i fallback selection smoke
        id: m3i_fallback
        continue-on-error: true
        env:
          BROWSER_SMOKE_CASE: m3i-selection-fallback
        run: npm run test:browser-smoke
      - name: Run real-browser smoke suite
        run: npm run test:browser-smoke
      - name: Verify production dependency tree
        run: npm ls --omit=dev --depth=0
      - name: Capture artifact digest
        id: artifact
        shell: bash
        run: echo "digest=$(sha256sum dist-site/artifact-manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload immutable static artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cosmic-site-${{ github.sha }}
          path: dist-site/
          if-no-files-found: error
          compression-level: 0
      - name: Report artifact provenance
        run: echo "source=${{ github.sha }} manifest_sha256=${{ steps.artifact.outputs.digest }}"
