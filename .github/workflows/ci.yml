name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  classify-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - bucket: ts0xxx
            pattern: 'error TS0[0-9]{3}'
          - bucket: ts1xxx
            pattern: 'error TS1[0-9]{3}'
          - bucket: ts2xxx
            pattern: 'error TS2[0-9]{3}'
          - bucket: ts5xxx
            pattern: 'error TS5[0-9]{3}'
          - bucket: ts6xxx
            pattern: 'error TS6[0-9]{3}'
          - bucket: ts7xxx
            pattern: 'error TS7[0-9]{3}'
          - bucket: ts8xxx
            pattern: 'error TS8[0-9]{3}'
          - bucket: any-ts
            pattern: 'error TS[0-9]+'
    name: diagnostic-${{ matrix.bucket }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Classify TypeScript diagnostic
        env:
          PATTERN: ${{ matrix.pattern }}
        run: |
          npx tsc --noEmit --pretty false > diagnostics.txt 2>&1 || true
          if grep -Eq "$PATTERN" diagnostics.txt; then exit 1; fi
