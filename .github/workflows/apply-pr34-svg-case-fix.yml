name: Apply PR34 SVG case fix

on:
  workflow_dispatch:
  push:
    branches: [feat/professional-visual-redesign]
    paths: [.github/workflows/apply-pr34-svg-case-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/professional-visual-redesign
      - name: Patch browser SVG attribute case handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          adapter = Path('src/browser-dom-adapter.ts')
          text = adapter.read_text()
          old = "if(element.getAttributeNames().length!==allowed.length||allowed.some((name)=>element.getAttribute(name)===null))fail(kind,'attribute');"
          new = "const names=new Set(element.getAttributeNames().map((name)=>name.toLowerCase()));if(names.size!==allowed.length||allowed.some((name)=>!names.has(name)))fail(kind,'attribute');"
          if text.count(old) != 1:
              raise SystemExit('adapter replacement boundary mismatch')
          adapter.write_text(text.replace(old, new))

          test = Path('tests/browser-dom-adapter.test.ts')
          text = test.read_text()
          old = "viewbox: '-1 -1 5 5', preserveaspectratio: 'xMidYMid meet'"
          new = "viewBox: '-1 -1 5 5', preserveAspectRatio: 'xMidYMid meet'"
          if text.count(old) != 1:
              raise SystemExit('test replacement boundary mismatch')
          test.write_text(text.replace(old, new))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-pr34-svg-case-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/browser-dom-adapter.ts tests/browser-dom-adapter.test.ts .github/workflows/apply-pr34-svg-case-fix.yml
          git commit -m "fix: handle browser SVG attribute casing"
          git push origin HEAD:feat/professional-visual-redesign
