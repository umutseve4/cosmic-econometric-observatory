name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source and deterministic artifact
        run: npm run verify
        env:
          SOURCE_SHA: ${{ github.sha }}
      - name: Verify packaged browser runtime
        run: npm run test:browser-smoke
        env:
          SOURCE_SHA: ${{ github.sha }}
      - name: Record promoted artifact provenance
        id: provenance
        shell: bash
        run: |
          manifest_sha256="$(sha256sum dist-site/artifact-manifest.json | cut -d ' ' -f 1)"
          artifact_files="$(find dist-site -type f | wc -l)"
          test "$artifact_files" -eq 12
          echo "manifest_sha256=${manifest_sha256}" >> "$GITHUB_OUTPUT"
          {
            echo '### Pages artifact provenance'
            printf -- '- Source SHA: `%s`\n' "$GITHUB_SHA"
            printf -- '- Manifest SHA-256: `%s`\n' "$manifest_sha256"
            printf -- '- Artifact files: `%s`\n' "$artifact_files"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Read GitHub Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist-site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact uploaded artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
