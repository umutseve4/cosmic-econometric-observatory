name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source and deterministic artifact
        run: npm run verify
        env:
          SOURCE_SHA: ${{ github.sha }}
      - name: Verify packaged browser runtime
        run: npm run test:browser-smoke
        env:
          SOURCE_SHA: ${{ github.sha }}
      - name: Record promoted artifact provenance
        id: provenance
        shell: bash
        run: |
          set -o pipefail
          manifest_sha256="$(sha256sum dist-site/deployment-provenance.json | cut -d ' ' -f 1)"
          artifact_files="$(find dist-site -type f | wc -l)"
          # Every payload file is recorded in the manifest, so the tree must hold
          # exactly the manifest's own entries plus the manifest itself. Deriving
          # the bound keeps this a hard fail-closed check against any unrecorded
          # file while removing a constant that silently rots whenever a module is
          # legitimately added to the site build.
          manifest_entries="$(node -e 'const m=JSON.parse(require("node:fs").readFileSync("dist-site/deployment-provenance.json","utf8")); if(!Array.isArray(m.files)) throw new Error("PAGES_MANIFEST_SHAPE_DRIFT"); process.stdout.write(String(m.files.length));')"
          expected_files="$((manifest_entries + 1))"
          test "$artifact_files" -eq "$expected_files"
          echo "manifest_sha256=${manifest_sha256}" >> "$GITHUB_OUTPUT"
          {
            echo '### Pages artifact provenance'
            printf -- '- Source SHA: `%s`\n' "$GITHUB_SHA"
            printf -- '- Manifest SHA-256: `%s`\n' "$manifest_sha256"
            printf -- '- Artifact files: `%s` (manifest entries `%s` + manifest)\n' "$artifact_files" "$manifest_entries"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Read GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist-site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact uploaded artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

  verify-production:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out exact deployed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify live provenance, parity, and canonical browsers
        id: production_acceptance
        shell: bash
        run: |
          set -o pipefail
          : > production-acceptance.log
          for attempt in 1 2 3; do
            echo "Production acceptance attempt ${attempt}/3" | tee -a production-acceptance.log
            if npm run verify:production 2>&1 | tee -a production-acceptance.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
      - name: Preserve production acceptance diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: production-acceptance-${{ github.sha }}
          path: production-acceptance.log
          if-no-files-found: error
          retention-days: 30
      - name: Report production acceptance failure on checkpoint
        if: ${{ failure() && steps.production_acceptance.conclusion == 'failure' && hashFiles('production-acceptance.log') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tail -c 6000 production-acceptance.log > production-acceptance-tail.log
          body=$(printf 'Production acceptance failed on exact source `%s` in Pages run `%s` (job `%s`). Issue remains fail-closed.\n\n```text\n%s\n```' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB" "$(cat production-acceptance-tail.log)")
          gh api "repos/$GITHUB_REPOSITORY/issues/35/comments" --raw-field body="$body"
