name: Apply PR34 final blocker fixes
on:
  push:
    branches: [feat/professional-visual-redesign]
    paths: [.github/workflows/apply-pr34-blocker-fixes.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/professional-visual-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact CSS corrections
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'site/styles.css';
          let s = fs.readFileSync(p, 'utf8');
          const replacements = [
            ['--dim:#69808b', '--dim:#8299a4'],
            ['.viewport-frame::before{content:"CANLI ANALİZ EVRENİ";position:absolute;left:1.4rem;top:1rem;z-index:3;font-size:.64rem;font-weight:900;letter-spacing:.18em;color:#9eb0b9}', ''],
            ['.viewport canvas,.viewport svg{display:block;width:100%!important;height:100%!important;background:radial-gradient(circle at 50% 35%,rgba(41,78,105,.2),transparent 55%);border-radius:16px}', '.viewport canvas{display:block;width:100%!important;height:auto!important;aspect-ratio:4/3;background:radial-gradient(circle at 50% 35%,rgba(41,78,105,.2),transparent 55%);border-radius:16px}.viewport svg{display:block;width:100%!important;height:100%!important;background:radial-gradient(circle at 50% 35%,rgba(41,78,105,.2),transparent 55%);border-radius:16px}'],
            ['.viewport-frame::before{left:1rem;font-size:.61rem}', '']
          ];
          for (const [from, to] of replacements) {
            if (!s.includes(from)) throw new Error(`missing CSS contract: ${from}`);
            s = s.replace(from, to);
          }
          fs.writeFileSync(p, s);
          NODE
      - run: npm ci
      - run: npm run verify
      - run: npm run test:browser-smoke
      - name: Commit verified patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-pr34-blocker-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/styles.css .github/workflows/apply-pr34-blocker-fixes.yml
          git commit -m "fix(site): close professional visual acceptance blockers"
          git push origin HEAD:feat/professional-visual-redesign
