name: Apply PR34 final blocker fixes
on:
  push:
    branches: [feat/professional-visual-redesign]
    paths: [.github/workflows/apply-pr34-blocker-fixes.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/professional-visual-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch, verify, and persist evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function exact(path, from, to) {
            let s = fs.readFileSync(path, 'utf8');
            if (!s.includes(from)) throw new Error(`missing contract in ${path}: ${from}`);
            fs.writeFileSync(path, s.replace(from, to));
          }
          const cssPath = 'site/styles.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          css = css.replace('--dim:#69808b', '--dim:#8299a4');
          css = css.replace(/\.viewport-frame::before\{[^}]*\}/gu, '');
          css = css.replace(/\.viewport canvas,\.viewport svg\{([^}]*)\}/u, (_all, rules) => `.viewport canvas{${rules.replace('height:100%!important', 'height:auto!important')}aspect-ratio:4/3}.viewport svg{${rules}}`);
          fs.writeFileSync(cssPath, css);

          exact('src/browser-dom-adapter.ts',
            "const SVG_ATTRIBUTES = new Set(['id','tabindex','role','aria-label','data-node-id','data-edge-id','data-semantic-kind','data-source','data-target','cx','cy','r']);",
            "const SVG_ATTRIBUTES = new Set(['id','tabindex','role','aria-label','data-node-id','data-edge-id','data-semantic-kind','data-source','data-target','cx','cy','r','viewbox','preserveaspectratio','d','fill','stroke','stroke-width']);");
          exact('src/browser-dom-adapter.ts',
            "attrs(svg,'svg',['role','aria-label']);",
            "attrs(svg,'svg',['role','aria-label','viewbox','preserveaspectratio']);");
          exact('src/browser-dom-adapter.ts',
            "attrs(edge,'svg',['data-edge-id','data-semantic-kind','data-source','data-target']);",
            "attrs(edge,'svg',['data-edge-id','data-semantic-kind','data-source','data-target','d','fill','stroke','stroke-width']);");

          exact('tests/browser-dom-adapter.test.ts',
            "return [e('svg', S, { role: 'group', 'aria-label': 'Academic knowledge universe' }, [",
            "return [e('svg', S, { role: 'group', 'aria-label': 'Academic knowledge universe', viewbox: '-1 -1 5 5', preserveaspectratio: 'xMidYMid meet' }, [");
          exact('tests/browser-dom-adapter.test.ts',
            "'data-target': 'node:b' })",
            "'data-target': 'node:b', d: 'M 1 1 L 2 2', fill: 'none', stroke: '#8ca2ff', 'stroke-width': '0.08' })");
          exact('tests/browser-dom-adapter.test.ts',
            "'data-target': 'node:missing' });",
            "'data-target': 'node:missing', d: 'M 1 1 L 2 2', fill: 'none', stroke: '#8ca2ff', 'stroke-width': '0.08' });");
          NODE
          npm ci
          set +e
          npm run verify > pr34-ci-diagnostic.txt 2>&1
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            npm run test:browser-smoke >> pr34-ci-diagnostic.txt 2>&1
            STATUS=$?
          fi
          set -e
          rm .github/workflows/apply-pr34-blocker-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$STATUS" -eq 0 ]; then
            rm pr34-ci-diagnostic.txt
            git add site/styles.css src/browser-dom-adapter.ts tests/browser-dom-adapter.test.ts .github/workflows/apply-pr34-blocker-fixes.yml
            git commit -m "fix(site): complete professional geometry acceptance"
          else
            git add site/styles.css src/browser-dom-adapter.ts tests/browser-dom-adapter.test.ts .github/workflows/apply-pr34-blocker-fixes.yml pr34-ci-diagnostic.txt
            git commit -m "chore: capture PR 34 hosted verification failure"
          fi
          git push origin HEAD:feat/professional-visual-redesign
