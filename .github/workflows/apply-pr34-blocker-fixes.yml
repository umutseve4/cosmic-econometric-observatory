name: Apply PR34 final blocker fixes
on:
  push:
    branches: [feat/professional-visual-redesign]
    paths: [.github/workflows/apply-pr34-blocker-fixes.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/professional-visual-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded CSS corrections
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'site/styles.css';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace('--dim:#69808b', '--dim:#8299a4');
          s = s.replace(/\.viewport-frame::before\{content:"CANLI ANALİZ EVRENİ";[^}]*\}/u, '');
          s = s.replace(/\.viewport canvas,\.viewport svg\{([^}]*)\}/u, (_all, rules) => `.viewport canvas{${rules.replace('height:100%!important', 'height:auto!important')}aspect-ratio:4/3}.viewport svg{${rules}}`);
          s = s.replace(/\.viewport-frame::before\{left:1rem;font-size:\.61rem\}/u, '');
          if (!s.includes('--dim:#8299a4') || s.includes('CANLI ANALİZ EVRENİ') || !s.includes('.viewport canvas{') || !s.includes('height:auto!important') || !s.includes('aspect-ratio:4/3') || !s.includes('.viewport svg{')) throw new Error('CSS blocker postcondition failed');
          fs.writeFileSync(p, s);
          NODE
      - run: npm ci
      - run: npm run verify
      - run: npm run test:browser-smoke
      - name: Commit verified patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-pr34-blocker-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/styles.css .github/workflows/apply-pr34-blocker-fixes.yml
          git commit -m "fix(site): close professional visual acceptance blockers"
          git push origin HEAD:feat/professional-visual-redesign
