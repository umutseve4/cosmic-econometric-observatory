name: M3g diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  isolate:
    name: diagnose-${{ matrix.phase }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        phase: [typecheck, tests, artifact, browser-m3d-dom, browser-m3f-three, browser-m3g-artifact]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - if: matrix.phase == 'typecheck'
        run: npm run typecheck
      - if: matrix.phase == 'tests'
        run: npm test
      - if: matrix.phase == 'artifact'
        run: npm run verify:site
      - if: startsWith(matrix.phase, 'browser-')
        run: npm run verify:site && BROWSER_SMOKE_CASE="${{ replace(matrix.phase, 'browser-', '') }}" npm run test:browser-smoke
