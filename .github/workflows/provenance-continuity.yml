name: Public provenance continuity

on:
  workflow_run:
    workflows: [Pages]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: public-provenance-continuity
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact deployed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Wait for delayed public probe
        if: github.event_name == 'workflow_run'
        run: sleep 120
      - name: Verify public provenance continuity
        shell: bash
        run: |
          set -o pipefail
          npm run verify:provenance-continuity 2>&1 | tee public-provenance-continuity.log
        env:
          SITE_URL: https://umutseve4.github.io/cosmic-econometric-observatory/
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Preserve exact-SHA continuity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: public-provenance-continuity-${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.run_id }}
          path: public-provenance-continuity.log
          if-no-files-found: error
          retention-days: 30
