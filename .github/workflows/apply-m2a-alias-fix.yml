name: Apply M2a alias security patch

on:
  push:
    branches: [feat/m2a-curriculum-graph-core]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m2a-curriculum-graph-core
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Guard and patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c7f9e0620d5291e48d85bff2bdc396a515467f3f"
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path); text = p.read_text()
              if text.count(old) != 1: raise SystemExit(f"expected one match in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new))

          replace('src/curriculum-compiler.ts',
            'routeManifest: compileRoutes(nodes, graphHash, previous?.routeManifest)',
            'routeManifest: compileRoutes(nodes, graphHash)')
          replace('src/curriculum-compiler.ts', '''    if (canonicalize(immutableNodeSemantics(retained)) !== canonicalize(immutableNodeSemantics(node))) throw new Error(`Insertion-only history changed node: ${node.id}`);''', '''    if (node.kind === 'course') {
      const retainedAssignments = new Set((retained.codeAssignments ?? []).map((assignment) => canonicalize(assignment)));
      if ((node.codeAssignments ?? []).some((assignment) => !retainedAssignments.has(canonicalize(assignment)))) {
        throw new Error(`Insertion-only history changed course assignment history: ${node.id}`);
      }
    }
    if (canonicalize(immutableNodeSemantics(retained)) !== canonicalize(immutableNodeSemantics(node))) throw new Error(`Insertion-only history changed node: ${node.id}`);''')
          replace('src/curriculum-compiler.ts', '''function compileRoutes(nodes: readonly CurriculumGraphNode[], graphHash: `sha256:${string}`, previous?: RouteManifestV1): RouteManifestV1 {
  const retained = new Map(previous?.routes.map((route) => [route.nodeId, route] as const) ?? []);
  const routes = [...nodes].sort(compareNodes).map((node): RouteEntry => {
    const current = routeFor(node);
    const prior = retained.get(node.id);
    if (prior === undefined) return current;
    return {
      nodeId: node.id,
      canonicalUrl: prior.canonicalUrl,
      aliases: [...new Set([...prior.aliases, ...current.aliases])].sort(compareCodePoints)
    };
  });''', '''function compileRoutes(nodes: readonly CurriculumGraphNode[], graphHash: `sha256:${string}`): RouteManifestV1 {
  const routes = [...nodes].sort(compareNodes).map(routeFor);''')
          replace('src/curriculum-compiler.ts', '''function validatePreviousRoute(node: CurriculumGraphNode, route: RouteEntry): void {
  const expected = routeFor(node);
  const normalizedAliases = [...new Set(route.aliases)].sort(compareCodePoints);
  const aliases = new Set(route.aliases);
  const malformedAlias = node.kind === 'course'
    ? route.aliases.some((alias) => !isCourseAliasForNode(alias, node.id))
    : route.aliases.length > 0;
  if (route.nodeId !== expected.nodeId || route.canonicalUrl !== expected.canonicalUrl ||
      canonicalize(route.aliases) !== canonicalize(normalizedAliases) || malformedAlias ||
      expected.aliases.some((alias) => !aliases.has(alias))) {
    throw new Error(`Previous route drift: ${route.nodeId}`);
  }
}

function isCourseAliasForNode(alias: string, nodeId: string): boolean {
  const prefix = '/v1/courses/';
  const suffix = `/${encodeURIComponent(nodeId)}`;
  if (!alias.startsWith(prefix) || !alias.endsWith(suffix)) return false;
  const encodedCode = alias.slice(prefix.length, alias.length - suffix.length);
  if (encodedCode.length === 0 || encodedCode.includes('/')) return false;
  try {
    const code = decodeURIComponent(encodedCode);
    return code.length > 0 && encodedCode === encodeURIComponent(code.toLowerCase());
  } catch {
    return false;
  }
}''', '''function validatePreviousRoute(node: CurriculumGraphNode, route: RouteEntry): void {
  if (canonicalize(route) !== canonicalize(routeFor(node))) throw new Error(`Previous route drift: ${route.nodeId}`);
}''')

          p = Path('tests/curriculum-compiler.test.ts'); text = p.read_text()
          start = text.index("test('code-only evolution preserves identity routes and monotonically unions aliases'")
          end = text.index("test('canonical routes use persistent IDs", start)
          replacement = '''test('title and additive code evolution preserve identity and derive cumulative aliases', () => {
  const baseline = compileBuuCurriculum(snapshot);
  const course = snapshot.courses.find((item) => item.codeAssignments[0]?.value === 'EKO3310')!;
  const added = { value: 'EKO3310Y', validFrom: '2026-09-01' };
  const evolved: BuuSnapshot = {
    ...snapshot,
    courses: snapshot.courses.map((item) => item.id === course.id
      ? { ...item, canonicalTitle: `${item.canonicalTitle} (Revised)`, codeAssignments: [...item.codeAssignments, added] }
      : item)
  };
  const next = compileBuuCurriculum(evolved, baseline);
  const expectedAliases = [...course.codeAssignments, added]
    .map((assignment) => `/v1/courses/${assignment.value.toLowerCase()}/${encodeURIComponent(course.id)}`)
    .sort(compareCodePoints);
  assert.deepEqual(anchorFor(next, course.id), anchorFor(baseline, course.id));
  assert.equal(routeFor(next, course.id).canonicalUrl, routeFor(baseline, course.id).canonicalUrl);
  assert.deepEqual(routeFor(next, course.id).aliases, expectedAliases);
});

'''
          p.write_text(text[:start] + replacement + text[end:])

          marker = "test('insertion-only history rejects removal of a previously compiled node'"
          text = p.read_text(); idx = text.index(marker)
          added_tests = '''test('previous routes must be the exact projection of previous assignment history', () => {
  const baseline = compileBuuCurriculum(snapshot);
  const course = snapshot.courses.find((item) => item.codeAssignments[0]?.value === 'EKO3310')!;
  const routeIndex = baseline.routeManifest.routes.findIndex((route) => route.nodeId === course.id);
  const original = baseline.routeManifest.routes[routeIndex]!;
  const other = baseline.routeManifest.routes.find((route) => route.nodeId !== course.id && route.aliases.length > 0)!;
  const variants = [
    { ...original, aliases: [...original.aliases, `/v1/courses/forged/${encodeURIComponent(course.id)}`].sort(compareCodePoints) },
    { ...original, aliases: [] },
    { ...original, aliases: [original.aliases[0]!, original.aliases[0]!] },
    { ...original, aliases: [`/v1/courses/z/${encodeURIComponent(course.id)}`, original.aliases[0]!] },
    { ...original, aliases: [other.aliases[0]!] }
  ];
  for (const variant of variants) {
    const tampered = replacePrevious(baseline, { routeManifest: { ...baseline.routeManifest, routes: baseline.routeManifest.routes.map((route, index) => index === routeIndex ? variant : route) } });
    assert.throws(() => compileBuuCurriculum(snapshot, tampered), /Previous route drift/);
  }
});

test('course assignment history is cumulative and prior records are immutable', () => {
  const baseline = compileBuuCurriculum(snapshot);
  const course = snapshot.courses.find((item) => item.codeAssignments[0]?.value === 'EKO3310')!;
  const evolve = (codeAssignments: Course['codeAssignments']): BuuSnapshot => ({
    ...snapshot,
    courses: snapshot.courses.map((item) => item.id === course.id ? { ...item, codeAssignments } : item)
  });
  assert.throws(() => compileBuuCurriculum(evolve([]), baseline), /changed course assignment history/);
  assert.throws(() => compileBuuCurriculum(evolve(course.codeAssignments.map((item) => ({ ...item, validTo: '2026-08-31' }))), baseline), /changed course assignment history/);
});

'''
          p.write_text(text[:idx] + added_tests + text[idx:])

          replace('README.md', 'Retained anchors, slots, coordinates, and canonical `/v1/nodes/{persistent-id}` URLs remain stable. Course aliases form a monotonic, deterministic, code-point-sorted union of previous and current code assignments; aliases are never deleted.', 'Retained anchors, slots, coordinates, and canonical `/v1/nodes/{persistent-id}` URLs remain stable. Prior course-assignment records are immutable and cumulative; aliases are derived exactly and deterministically from that cumulative assignment history.')
          replace('README.md', 'Duplicate/dangling identities, malformed or mixed provenance, unknown anomaly references, silent relation drift, prior-node removal, and tampered previous state are fatal.', 'Duplicate/dangling identities, malformed or mixed provenance, unknown anomaly references, silent relation drift, prior-node removal, internally inconsistent predecessor state, and enforceable continuity violations are fatal. The compiler validates continuity relative to the supplied predecessor; without an external trust anchor it does not authenticate that predecessor or detect a coordinated full-bundle rewrite.')
          replace('docs/adr/0002-m2a-curriculum-graph-core.md', 'Retained anchors and canonical `/v1/nodes/{persistent-id}` URLs remain stable. Course aliases form a monotonic, deterministic, code-point-sorted union of previous and current code assignments and are never deleted; only new nodes receive deterministic collision-resolved slots and routes.', 'Retained anchors and canonical `/v1/nodes/{persistent-id}` URLs remain stable. Prior course-assignment records are immutable and cumulative, and course aliases are the exact deterministic projection of that cumulative history; only new nodes receive deterministic collision-resolved slots and routes.')
          replace('docs/adr/0002-m2a-curriculum-graph-core.md', '## Deliberate exclusions', '''The graph hash and manifests establish internal consistency, not predecessor authenticity. The compiler validates append-only continuity relative to the supplied predecessor compilation. Authenticating that predecessor, or detecting a coordinated rewrite of the entire predecessor bundle, requires an external trust anchor such as a signed or immutable checkpoint and is outside M2a.

## Deliberate exclusions''')
          Path('.github/workflows/apply-m2a-alias-fix.yml').unlink()
          PY
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: enforce cumulative M2a route history"
          git push origin HEAD:feat/m2a-curriculum-graph-core
