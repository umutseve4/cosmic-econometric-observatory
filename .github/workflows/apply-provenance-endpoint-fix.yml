name: Apply production provenance endpoint fix

on:
  push:
    branches: [fix/pages-provenance-endpoint]
    paths: [.github/workflows/apply-provenance-endpoint-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pages-provenance-endpoint
          fetch-depth: 0
      - name: Apply bounded endpoint rename
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('scripts/build-site.mjs'),
              Path('scripts/verify-site.mjs'),
              Path('scripts/verify-live-site.mjs'),
          ]
          old = 'artifact-manifest.json'
          new = 'deployment-provenance.json'
          counts = {}
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'expected reference missing: {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              counts[str(path)] = count
          if counts != {
              'scripts/build-site.mjs': 2,
              'scripts/verify-site.mjs': 3,
              'scripts/verify-live-site.mjs': 1,
          }:
              raise SystemExit(f'unexpected replacement counts: {counts}')
          print(counts)
          PY
          git rm .github/workflows/apply-provenance-endpoint-fix.yml
          git diff --check
          git diff --exit-code -- scripts/build-site.mjs scripts/verify-site.mjs scripts/verify-live-site.mjs >/dev/null && exit 1 || true
      - name: Commit bounded correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build-site.mjs scripts/verify-site.mjs scripts/verify-live-site.mjs
          git commit -m "fix: publish provenance at a non-reserved Pages path"
          git push origin HEAD:fix/pages-provenance-endpoint
